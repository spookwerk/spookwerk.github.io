<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spookwerk</title>
    <link rel="alternate" type="application/rss+xml" title="Spookwerk Blog" href="/blog/feed.xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 0.75rem;
        }
        .tagline {
            font-size: 1.1rem;
            color: #888;
            margin-bottom: 3rem;
        }
        .apps {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }
        .app-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            background: #161616;
            border: 1px solid #222;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s;
        }
        .app-card:hover {
            border-color: #444;
        }
        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 11px;
            background: linear-gradient(135deg, #1a7aff, #34c759);
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .app-info {
            text-align: left;
        }
        .app-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }
        .app-desc {
            font-size: 0.85rem;
            color: #888;
            margin-top: 0.2rem;
        }
        .more-link {
            margin-top: 2rem;
            font-size: 0.9rem;
        }
        .more-link a {
            color: #888;
            text-decoration: none;
            transition: color 0.2s;
        }
        .more-link a:hover { color: #ccc; }
        footer {
            margin-top: 4rem;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Spookwerk</h1>
        <p class="tagline">Apps that respect your data</p>
        <div class="apps">
            <a href="/apps/vitadatum/" class="app-card">
                <div class="app-icon">&#9829;</div>
                <div class="app-info">
                    <div class="app-name">Vitadatum</div>
                    <div class="app-desc">Export your Apple Health data to JSON and CSV</div>
                </div>
            </a>
        </div>
        <p class="more-link"><a href="/blog/">Read the blog &rarr;</a></p>
    </div>
    <footer>&copy; 2026 Spookwerk &middot; KvK 42035025</footer>
</body>
</html>
