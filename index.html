    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #ECE7DA;            /* bone — page background */
            --surface: #F3EFE5;       /* card surface */
            --border: #DBD4C3;        /* hairline borders */
            --ink: #16140F;           /* headings / strong text */
            --text: #2B2820;          /* body text */
            --text-soft: #4A4538;     /* secondary text (descriptions) */
            --muted: #7A7466;         /* faint text (tagline, footer) */
            --link: #246B7A;          /* teal links */
            --link-underline: #B7CDD3;/* teal link underline */
            --accent: #936518;        /* brass — dates, small accents */
            --accent-strong: #B8893F; /* brass — hover / active borders */
        }
        body {
            font-family: 'Avenir Next', 'Futura', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 600px;
            text-align: center;
        }
        .brand {
            line-height: 0;
            margin-bottom: 0.75rem;
        }
        .brand img {
            width: min(340px, 75%);
            height: auto;
            display: inline-block;
            opacity: 0.92;
        }
        .tagline {
            font-size: 1.1rem;
            color: var(--muted);
            margin-bottom: 3rem;
        }
        .apps {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }
        .app-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1.25rem 1.5rem;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .app-card:hover {
            border-color: var(--accent-strong);
            box-shadow: 0 4px 16px rgba(22, 20, 15, 0.06);
        }
        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 11px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .app-icon img {
            width: 100%;
            height: 100%;
            display: block;
        }
        .app-info {
            text-align: left;
        }
        .app-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--ink);
        }
        .app-badge {
            display: inline-block;
            margin-left: 0.5rem;
            padding: 0.15rem 0.5rem;
            background: rgba(147, 101, 24, 0.10);
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 600;
            border-radius: 4px;
            vertical-align: middle;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }
        .app-desc {
            font-size: 0.85rem;
            color: var(--text-soft);
            margin-top: 0.2rem;
        }
        .more-link {
            margin-top: 2rem;
            font-size: 0.9rem;
        }
        .more-link a {
            color: var(--link);
            text-decoration: none;
            border-bottom: 1px solid var(--link-underline);
            transition: border-color 0.2s;
        }
        .more-link a:hover { border-bottom-color: var(--link); }
        footer {
            margin-top: 4rem;
            font-size: 0.8rem;
            color: var(--muted);
            line-height: 1.7;
        }
        footer a {
            color: var(--muted);
            text-decoration: none;
            border-bottom: 1px solid var(--border);
        }
        footer a:hover {
            color: var(--ink);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="brand"><img src="/wordmark-light.svg" alt="Spookwerk"></h1>
        <p class="tagline">Apps that respect your data</p>
        <div class="apps">
            <a href="/apps/vitadatum/" class="app-card">

                <div class="app-info">

                    <div class="app-desc">Export your Apple Health data to JSON and CSV</div>
                </div>
            </a>

                </div>
