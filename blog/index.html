<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Spookwerk</title>
    <meta name="description" content="Coming soon. Building Vitadatum and Huurprijscheck.">
    <link rel="alternate" type="application/rss+xml" title="Spookwerk Blog" href="/blog/feed.xml">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            max-width: 640px;
            margin: 0 auto;
        }
        nav {
            margin-bottom: 3rem;
        }
        nav a {
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
        }
        nav a:hover { color: #ccc; }
        header {
            margin-bottom: 3rem;
        }
        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #fff;
            margin-bottom: 0.5rem;
        }
        .tagline {
            font-size: 1rem;
            color: #888;
        }
        .posts {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .post-card {
            display: block;
            padding: 1.5rem;
            background: #161616;
            border: 1px solid #222;
            border-radius: 12px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s;
        }
        .post-card:hover {
            border-color: #444;
        }
        .post-date {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.5rem;
            font-variant-numeric: tabular-nums;
        }
        .post-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }
        .post-excerpt {
            font-size: 0.95rem;
            color: #999;
            line-height: 1.5;
        }
        .empty {
            padding: 2rem;
            background: #161616;
            border: 1px solid #222;
            border-radius: 12px;
            color: #888;
            font-size: 0.95rem;
            text-align: center;
        }
        .badge {
            display: inline-block;
            margin-left: 0.5rem;
            padding: 0.2rem 0.6rem;
            background: #2a2a2a;
            color: #aaa;
            font-size: 0.75rem;
            font-weight: 500;
            border-radius: 5px;
            vertical-align: middle;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .feed-link {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #666;
        }
        .feed-link a {
            color: #888;
            text-decoration: none;
        }
        .feed-link a:hover { color: #ccc; }
        footer {
            margin-top: 4rem;
            padding-top: 2rem;
            border-top: 1px solid #1a1a1a;
            font-size: 0.8rem;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav><a href="/">&larr; Spookwerk</a></nav>
        <header>
            <h1>Blog <span class="badge">Coming Soon</span></h1>
            <p class="tagline">Building Vitadatum and Huurprijscheck.</p>
        </header>
        <div class="posts">
            <div class="empty">First post drops alongside Vitadatum's launch. Subscribe to the RSS feed below if you want a ping when posts start landing.</div>
        </div>
        <p class="feed-link"><a href="/blog/feed.xml">RSS feed</a></p>
        <footer>&copy; 2026 Spookwerk &middot; KvK 42035025</footer>
    </div>
</body>
</html>
